name: Compilar Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Probar y generar Setup + portable
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FORJA_TEST_PYTHON: python
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Obtener codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar version de la etiqueta
        run: |
          $source = Get-Content src/MiIALocal.Core/Configuration.cs -Raw
          $version = [regex]::Match($source, 'public const string Version = "([^"]+)"').Groups[1].Value
          if (!$version) { throw 'Falta la version del producto.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "La etiqueta debe coincidir con v$version." }
      - name: Preparar SDK .NET fijado
        run: ./scripts/Preparar-Desarrollo.ps1
      - name: Preparar compilador oficial de Setup
        run: ./scripts/Preparar-Instalador.ps1
      - name: Compilar, probar y empaquetar
        run: ./scripts/Compilar.ps1 -Publicar -CompiladorInstalador "$PWD/.tools/inno/ISCC.exe"
      - name: Guardar Setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: artifacts/paquete-*/*Setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Guardar portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable
          path: artifacts/paquete-*/*win-x64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Guardar manifiesto de integridad
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-manifiesto
          path: artifacts/paquete-*/paquete.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar version de desarrollo
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recuperar paquetes de esta compilacion
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - name: Crear prerelease con Setup y portable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: |
            Forja 50: version de desarrollo para Windows 11 x64, RTX 5070 Ti / RTX 5080 de escritorio (16 GB) y RTX 3090 (24 GB), con 32 GB de RAM.

            0.4.6: corrige el ruido de 0.4.5. Con una referencia, el lienzo toma su proporcion ajustada a la resolucion entrenada mas cercana (~4 MP) en lugar del tamano exacto de la miniatura, que dejaba al modelo fuera de distribucion. Se conserva el encuadre y el presupuesto de pixeles. Sin modelos ni GPU en CI; validacion fisica pendiente.

            0.4.5: con una unica imagen de referencia el resultado usa su tamano y su encuadre, al editar y al crear con referencia, como el flujo oficial de HiDream; una portada o un paisaje ancho ya no se copia como escena con el personaje chico. El asistente no inventa un paisaje cuando solo se pide un sujeto. Sin modelos ni GPU en CI; validacion fisica pendiente.

            0.4.4: el nombre pedido ya no se pierde. El detector conserva nombres en frases naturales y, si el asistente lo omite, Forja antepone el nombre (o el titulo de la referencia elegida) a la descripcion preparada. Editar usa el tamano y el encuadre de la imagen elegida, como el flujo oficial de HiDream, en lugar de agrandarla y rellenarla con bordes. Sin modelos ni GPU en CI; validacion fisica pendiente.

            0.4.3: la descripcion se entiende en el idioma del usuario y conserva los nombres propios escritos; el asistente deja de perder el personaje pedido. Edicion con el programador de flujo que recomienda HiDream, sin la reinyeccion de ruido por paso que producia grano. Las referencias de Wikipedia descartan paginas de desambiguacion. La animacion tambien prepara su instruccion de movimiento en ingles con revision editable. Escalera de calidad recomendada en 2048. Revision de descripcion editable antes de generar. Sin modelos ni GPU en CI; validacion fisica pendiente en las tres placas.

            0.4.2: interfaz WPF con renderizado compatible por software para evitar el camino acelerado ante bloques blancos. No cambia la inferencia CUDA ni los modelos. Preferencia verificada por la prueba de modos; pendiente confirmar en pantalla bajo las condiciones del fallo.

            0.4.1: corregida la carga del asistente visual en GPU con ahorro de memoria, liberacion por etapas y limite de espera. Revision de descripcion sin repetir el asistente, tiempo de preparacion incluido y errores claros si el proceso se cierra. Almacenamiento permite cerrar durante el calculo sin bloquear la desinstalacion. Pruebas de nucleo, puente y ventanas; no se ejecuta inferencia en CI. Medicion del asistente corregido y validacion fisica 5070 Ti/3090 pendientes.

            0.4.0: HiDream-O1 Dev nativo, 28 pasos, descarga sin cuenta/token, FP8 escalado en RTX 5080/5070 Ti y BF16 en RTX 3090. Asistente visual local opcional por etapas. Referencias con vista previa e historial conservado. Resolucion hasta 2048 experimental. Validacion de 5070 Ti/3090 pendiente.

            Dos modos independientes: Programacion e Imagenes y animacion. ComfyUI NVIDIA 0.42.1, HiDream Dev para crear/editar y Wan 2.2 5B opcional para animar. No requiere Qwen de programacion, OpenCode, Git ni repositorio. HiDream FP8: 8,07 GB; BF16 para 3090: 16,37 GB; asistente opcional: 8,09 GB; motor comprimido: 2,02 GB; Wan agrega unos 18,1 GB. Pesos descargados desde la app, nunca dentro de Setup/portable.

            Interfaz visual guiada: Preparar, Crear o editar y Ver resultado. Acciones Crear imagen, Editar imagen y Animar; vista previa de referencia, detalles tecnicos plegados e historial oscuro. Pausa de descarga y cancelacion dentro del modo visual. Semilla, pasos de animacion y exportacion PNG/MP4/GIF. Un modo activo a la vez; cambio confirmado detiene el anterior. Resultados y referencias protegidos en almacenamiento. Motor visual local con credencial efimera y sin nodos de nube.

            Desde 0.3.3, referencias opcionales de Wikipedia al crear imagen: termino detectado o editable, coincidencia de personaje preferida, seleccion ante ambiguedad y origen conservado en el historial. Sin claves de pago; desactivable para crear sin conexion. No recorre toda la web. Corregida la exportacion MP4 de ComfyUI 0.42.1 y los avisos genericos de memoria. MP4/H264 y GIF verificados con fotogramas sinteticos en CPU; la correccion completa de animacion requiere repetir la prueba real.

            0.3.4: los estilos generales, como anime de los 90, no obligan a elegir una serie. La busqueda automatica solo usa coincidencias claras; el selector queda para nombres buscados expresamente. Wan recibe su propio negativo codificado y conserva el pedido de movimiento y el estilo de la imagen inicial. Video cuadrado, horizontal o vertical; marco completo sin recorte. Ajuste y orientacion probados en CPU. El video aportado por el usuario evidencio deformaciones; la calidad del flujo revisado necesita una nueva prueba real.

            0.3.5: separa el nombre del personaje de descripciones como la elfa del anime o the elf. Conserva nombres compuestos y el pedido de la escena. Refuerza identidad al generar con referencia y muestra si se utilizo una imagen o se continuo sin ella. Prueba puntual en RTX 5080 completada con el pedido original de Frieren y referencia registrada; sin garantia de identidad perfecta ni validacion general de las otras placas.

            0.3.6: Iniciar IA, Detener y Pausar/Cancelar compartidos arriba a la derecha en ambos modos. Pantalla visual mas compacta, modelos plegados y ayudas segun la accion. Indicador de VRAM usada y libre con barra, actualizado cada cuatro segundos incluso durante la generacion; muestra el total de la placa, incluyendo otras aplicaciones. Prueba desde la interfaz en RTX 5080: imagen y animacion completadas, GIF/MP4 de 73 fotogramas a 576x576 comprobados. Se conservan modelos, ajustes e historial.

            MODO VISUAL EXPERIMENTAL: comprobados protocolo simulado, referencia, persistencia, autenticacion, GIF sintetico, extraccion 7z y ventanas. Pruebas puntuales de imagen, animacion y VRAM completadas en RTX 5080; pendientes la validacion fisica en 5070 Ti/3090, instalacion limpia y uso prolongado.

            Incluye Setup y ZIP portable, tema oscuro, configuracion avanzada, perfiles automaticos para cada placa y actualizador. Motor NInfer nativo Windows basado en el fork de Todd Ballinger; modelo oficial Qwen3.8-27B de 16,5 GB descargado desde el programa. No incluye pesos en el instalador.

            Descarga continua a maxima velocidad disponible: 16 conexiones, fragmentos persistentes, pausa y reanudacion, reintentos, velocidad reciente y tiempo estimado. Contexto inicial 64K; prefill 896 en 5080 y 512 en 5070 Ti. La compilacion comprueba el cierre inicial, solicitudes repetidas y cancelacion de operaciones al cerrar.

            La RTX 3090 selecciona automaticamente KVMem sm86 con Swift: 128K logicos, 96K de historial seleccionado en GPU, 16K de reserva y hasta 8 GiB de cache en RAM; prefill 512. Alternativas 64K/32K. El motor sm120a se deshabilita en esta placa. Perfil pendiente de prueba fisica, sin garantia de consumo/rendimiento.

            Setup agrupa carpeta de instalacion, acceso directo al escritorio (marcado por defecto) y abrir al terminar en una sola pantalla. El modelo se descarga despues desde Forja.

            Desde 0.2.4, las instalaciones nuevas usan Programs/Forja 50 para el programa y LocalAppData/Forja 50 para datos y modelos. Las actualizaciones conservan las carpetas existentes sin duplicar descargas; portable conserva app/datos. El desinstalador reconoce ambas carpetas de datos.

            Cuenta de GitHub: autorizacion en el navegador mediante Git Credential Manager oficial, sesion cifrada con Windows DPAPI en un almacen propio y cierre de sesion independiente. Opcional: no descarga modelos ni requiere iniciar la IA. El agente usa esa sesion para HTTPS sin modificar la configuracion global de Git.

            Paquetes Forja-50: Setup y Portable-win-x64. El nuevo actualizador reconoce tambien los nombres anteriores. Debido al cambio de URL del repositorio, las versiones hasta 0.2.2 pueden necesitar actualizar manualmente una vez.

            Borrar todos los datos desde almacenamiento ya no cierra Forja: reinicia la vista y conserva los proyectos. Al cerrar la app se pide confirmacion con No por defecto; solo confirmar cancela operaciones y detiene la IA antes de salir.

            Administrar almacenamiento permite elegir modelos, componentes, cache, conversaciones y ajustes, con rutas, espacio y confirmacion. El desinstalador ofrece abrir esa misma limpieza; conservar datos es la opcion inicial y la desinstalacion silenciosa los conserva. Los archivos importados, enlaces y repositorios Git quedan protegidos.

            La prueba de inferencia del nuevo motor nativo queda pendiente en ambas placas. Las pruebas historicas de la 5080 corresponden a KVMem. Pendientes tambien Windows limpio y uso prolongado. Los paquetes todavia no tienen firma de editor. Revisar las licencias del modelo y los componentes antes de usarlos.
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          manifests = list(root.rglob('paquete.json'))
          assert len(manifests) == 1, 'Se esperaba un manifiesto'
          manifest = json.loads(manifests[0].read_text(encoding='utf-8-sig'))
          assert manifest['SourceCommit'] == os.environ['GITHUB_SHA'], 'Commit de origen incorrecto'
          assert 'v' + manifest['Version'] == os.environ['RELEASE_TAG'], 'Version incorrecta'
          for item in (manifest, manifest['Setup']):
              matches = list(root.rglob(item['File']))
              assert len(matches) == 1, 'Paquete ausente o duplicado'
              package = matches[0]
              assert package.stat().st_size == item['Bytes'], 'Tamano incorrecto'
              digest = hashlib.sha256()
              with package.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(block)
              assert digest.hexdigest() == item['Sha256'], 'SHA-256 incorrecto'
          PY
          mapfile -d '' packages < <(find dist -type f \( -name '*-Setup.exe' -o -name '*-win-x64.zip' -o -name 'paquete.json' \) -print0)
          test "${#packages[@]}" -eq 3
          gh release create "$RELEASE_TAG" "${packages[@]}" --verify-tag --prerelease --title "Forja 50 $RELEASE_TAG" --notes "$RELEASE_NOTES"
