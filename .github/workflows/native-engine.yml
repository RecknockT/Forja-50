name: Compilar motor nativo NInfer
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-engine
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.native-cache/vcpkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Recuperar dependencias ya compiladas
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .native-cache/vcpkg
          key: native-vcpkg-windows2022-msvc1444-${{ hashFiles('build/ninfer-windows.lock.json', 'build/vcpkg-triplets/*') }}
      - name: Probar detección del runtime MSVC
        shell: pwsh
        run: ./scripts/Verificar-Motor-Nativo.ps1
      - name: Compilar fuente fijada y comprobar ayuda sin GPU
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          ./scripts/Compilar-Motor-Nativo.ps1 -WorkRoot "$env:RUNNER_TEMP/ninfer-native" -Jobs 4
      - name: Conservar ejecutable y paquete incluso si falla el empaquetado
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-engine-recovery
          path: |
            ${{ runner.temp }}/ninfer-native/package/
            ${{ runner.temp }}/ninfer-native/build/apps/ninfer-serve.exe
            ${{ runner.temp }}/ninfer-native/runtime.json
            ${{ runner.temp }}/ninfer-native/ninfer-native-windows-*.zip
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
      - name: Conservar dependencias aunque falle un paso posterior
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .native-cache/vcpkg
          key: native-vcpkg-windows2022-msvc1444-${{ hashFiles('build/ninfer-windows.lock.json', 'build/vcpkg-triplets/*') }}
      - name: Publicar motor experimental y procedencia
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = "$env:RUNNER_TEMP/ninfer-native"
          $metadata = Get-Content "$root/runtime.json" -Raw | ConvertFrom-Json
          $tag = 'ninfer-native-' + $metadata.SourceCommit.Substring(0,7)
          gh release create $tag "$root/$($metadata.File)" "$root/runtime.json" --target $env:GITHUB_SHA --prerelease --title 'NInfer nativo para Forja 50 · experimental' --notes 'Port Windows/MSVC de YukinoKaorisuna sobre ninfer-5080 de Todd Ballinger. Fuente y herramientas fijadas en source.json. Compilación y ayuda comprobadas; inferencia en GPU pendiente. Sin modelos incluidos.'
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo publicar el motor.' }
